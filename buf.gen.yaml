# Local plugins only — codegen must work offline and credential-free.
# Go plugins are pinned via go.mod `tool` directives; protoc-gen-es is an npm
# devDependency of web/. All generated output is committed.
version: v2
plugins:
  - local: ["go", "tool", "protoc-gen-go"]
    out: internal/gen
    opt: paths=source_relative
  - local: ["go", "tool", "protoc-gen-connect-go"]
    out: internal/gen
    opt: paths=source_relative
  - local: web/node_modules/.bin/protoc-gen-es
    out: web/src/gen
    opt:
      - target=ts
