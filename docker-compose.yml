# SPDX-License-Identifier: Apache-2.0
# One-command run: cp .env.example .env && docker compose up
# imresamu/postgis is the multi-arch (amd64+arm64) build of the official
# PostGIS images; the official postgis/postgis:16-3.4 ships amd64 only.
services:
  postgres:
    image: imresamu/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-climateshield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-climateshield}
      POSTGRES_DB: ${POSTGRES_DB:-climateshield}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-climateshield} -d ${POSTGRES_DB:-climateshield}"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: deploy/go.Dockerfile
      args: { CMD: migrate }
    environment: &appenv
      DATABASE_URL: postgres://${POSTGRES_USER:-climateshield}:${POSTGRES_PASSWORD:-climateshield}@postgres:5432/${POSTGRES_DB:-climateshield}?sslmode=disable
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CLIMATE_FIXTURE_DIR: /testdata/golden
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  ingestor:
    build:
      context: .
      dockerfile: deploy/go.Dockerfile
      args: { CMD: ingestor }
    environment:
      <<: *appenv
      CLIMATE_SOURCE: ${CLIMATE_SOURCE:-openmeteo}
      OPENMETEO_BASE_URL: ${OPENMETEO_BASE_URL:-https://api.open-meteo.com}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  predictor:
    build:
      context: .
      dockerfile: deploy/go.Dockerfile
      args: { CMD: predictor }
    environment: *appenv
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8091/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  ledger:
    build:
      context: .
      dockerfile: deploy/go.Dockerfile
      args: { CMD: ledger }
    environment: *appenv
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8093/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  notifier:
    build:
      context: .
      dockerfile: deploy/go.Dockerfile
      args: { CMD: notifier }
    environment:
      <<: *appenv
      NOTIFY_CHANNEL: ${NOTIFY_CHANNEL:-mock}
      MOCK_OUTBOX_PATH: /outbox/outbox.jsonl
      PII_KEY_HEX: ${PII_KEY_HEX:?set PII_KEY_HEX in .env (cp .env.example .env)}
    volumes:
      - ./var:/outbox
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8092/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  registry:
    build:
      context: .
      dockerfile: deploy/go.Dockerfile
      args: { CMD: registry }
    environment: *appenv
    ports:
      - "8082:8082"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/health"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
